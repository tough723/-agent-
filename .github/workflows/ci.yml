name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # POM 模型校验单独一步：依赖版本缺失这类问题会在这里暴露，
      # 而不是混在编译错误里。注意它是整个 reactor 的校验，
      # 任一模块 POM 有问题都会失败。
      - name: Validate POM model (all modules)
        run: mvn -B validate 2>&1 | tee /tmp/validate.log

      - name: Record resolved Spring AI version (ADR-001)
        run: |
          mvn -B -q dependency:tree -Dincludes=org.springframework.ai \
            -DoutputFile=/tmp/spring-ai-tree.txt -DappendOutput=true || true
          echo "===== resolved org.springframework.ai artifacts ====="
          cat /tmp/spring-ai-tree.txt 2>/dev/null || echo "(dependency:tree unavailable)"

      - name: Build & test oncall-domain (纯 Java，零外部依赖)
        run: mvn -B -pl oncall-domain -am test 2>&1 | tee /tmp/domain.log

      - name: Build & test oncall-tool-gateway (依赖 Spring AI)
        run: mvn -B -pl oncall-tool-gateway -am test 2>&1 | tee /tmp/gateway.log

      # 硬保险：surefire 2.x 遇到 JUnit 5 会静默跑 0 个测试并报成功。
      # 只有「测试数 > 0 且失败数 = 0」才算通过，不接受空跑。
      - name: Assert tests actually ran
        run: |
          set -euo pipefail
          total=0; failures=0; errors=0; skipped=0; files=0
          for f in $(find . -path '*/target/surefire-reports/*.txt'); do
            files=$((files+1))
            line=$(grep -m1 -E '^Tests run:' "$f" || true)
            [ -n "$line" ] || continue
            t=$(echo "$line" | sed -E 's/.*Tests run: *([0-9]+).*/\1/')
            fl=$(echo "$line" | sed -E 's/.*Failures: *([0-9]+).*/\1/')
            er=$(echo "$line" | sed -E 's/.*Errors: *([0-9]+).*/\1/')
            sk=$(echo "$line" | sed -E 's/.*Skipped: *([0-9]+).*/\1/')
            total=$((total+t)); failures=$((failures+fl)); errors=$((errors+er)); skipped=$((skipped+sk))
            echo "  $f -> $line"
          done
          echo "===== 报告文件数=$files 测试总数=$total 失败=$failures 错误=$errors 跳过=$skipped ====="
          if [ "$files" -eq 0 ]; then
            echo "❌ 没有找到任何 surefire 报告：测试根本没有执行（很可能 surefire 版本不支持 JUnit 5）"
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "❌ 测试总数为 0：构建「成功」但一个测试都没跑，这不叫通过"
            exit 1
          fi
          if [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ]; then
            echo "❌ 存在失败或错误的测试"
            exit 1
          fi
          echo "✅ $total 个测试全部执行且通过"

      # 失败时把关键错误回显到 job summary，便于从 API 侧读取
      - name: Surface errors on failure
        if: failure()
        run: |
          {
            echo "## 构建失败摘要"
            for f in /tmp/validate.log /tmp/domain.log /tmp/gateway.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "### $f"
              echo '```'
              grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Non-resolvable|is missing|error:|Tests run:.*Failures" "$f" | head -40
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "===== validate ====="; grep -E "\[ERROR\]|BUILD FAILURE" /tmp/validate.log 2>/dev/null | head -20
          echo "===== domain ====="; grep -E "\[ERROR\]|BUILD FAILURE|error:" /tmp/domain.log 2>/dev/null | head -30
          echo "===== gateway ====="; grep -E "\[ERROR\]|BUILD FAILURE|error:" /tmp/gateway.log 2>/dev/null | head -30

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/surefire-reports/*.txt'
          if-no-files-found: error
