name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 关键：默认 shell 不带 pipefail，`mvn ... | tee log` 的退出码取的是 tee 的 0，
# 会把 Maven 的失败伪装成「步骤成功」（本项目实测踩过，POM 不可解析却全绿）。
# 这里统一加 -e -o pipefail，让管道里任何一环失败都真正失败。
defaults:
  run:
    shell: bash -e -o pipefail {0}

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 先确认所有 POM 是合法且可解析的 XML。XML 注释里出现连续两个减号就会
      # 直接 Non-parseable，而这类错误如果发生在管道里很容易被吞掉。
      - name: Check all POM files are well-formed XML
        run: |
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import xml.etree.ElementTree as ET,sys; ET.parse(sys.argv[1])" "$f"; then
              echo "::error::$f 不是合法 XML"
              fail=1
            else
              echo "OK  $f"
            fi
          done < <(find . -name pom.xml)
          exit $fail

      # POM 模型校验：依赖缺 version 这类问题在这里暴露，与编译错误分开
      - name: Validate POM model (all modules)
        run: mvn -B validate

      - name: Record resolved Spring AI version (ADR-001)
        run: |
          mvn -B -q dependency:tree -Dincludes=org.springframework.ai \
            -DoutputFile=/tmp/spring-ai-tree.txt -DappendOutput=true || true
          echo "===== resolved org.springframework.ai artifacts ====="
          cat /tmp/spring-ai-tree.txt 2>/dev/null || echo "(dependency:tree unavailable)"
          # 以 annotation 形式带出，便于从 API 侧读取
          grep -Eo "org.springframework.ai:[a-z-]+:jar:[0-9][^ :]*" /tmp/spring-ai-tree.txt 2>/dev/null \
            | sort -u | head -8 | sed 's/^/::notice::AI-DEP /' || true

      # 六个模块统一走这个模式：失败时把 [ERROR] 行与失败测试作为 annotation 发出。
      # 原因是 CI 的 job 日志在开发沙箱里取不到（下载接口 SSL 失败），
      # check-run annotation 是唯一可读的输出通道——没有它就等于闭着眼睛改。
      - name: Build & test oncall-domain (纯 Java，零外部依赖)
        run: ./.github/mvn-test.sh oncall-domain

      - name: Build & test oncall-config (配置治理，纯 Java，零外部依赖)
        run: ./.github/mvn-test.sh oncall-config

      - name: Build & test oncall-config-admin (REST 接入层，依赖 Spring Web)
        run: ./.github/mvn-test.sh oncall-config-admin

      - name: Build & test oncall-tool-gateway (依赖 Spring AI)
        run: ./.github/mvn-test.sh oncall-tool-gateway

      - name: Build & test oncall-ontology (轻量本体，纯 Java，零外部依赖)
        run: ./.github/mvn-test.sh oncall-ontology

      # 必须排在最后：F9 要能看到网关以外的代码，它依赖全部模块。
      # 这个模块没有生产代码，只有架构约束测试。
      - name: Build & test oncall-archtest (架构约束 F1-F4、F9)
        run: ./.github/mvn-test.sh oncall-archtest

      # ArchUnit 是新引入的依赖，把解析到的版本带出来，
      # 坐标或版本写错时这里是第一个能看到证据的地方。
      - name: Record resolved ArchUnit version
        run: |
          mvn -B -q dependency:tree -Dincludes=com.tngtech.archunit \
            -DoutputFile=/tmp/archunit-tree.txt -DappendOutput=true || true
          grep -Eo "com.tngtech.archunit:[a-z0-9-]+:jar:[0-9][^ :]*" /tmp/archunit-tree.txt 2>/dev/null \
            | sort -u | head -4 | sed 's/^/::notice::ARCHUNIT-DEP /' || true

      # 引入 Spring Boot 后，通用件（spring-core / jackson）的版本由 Boot BOM 决定。
      # 这里把实际解析到的版本带出来，一旦与 Spring AI 的期望不符可以立刻看到，
      # 而不是等到运行时 NoSuchMethodError。
      - name: Record resolved Spring Framework / Jackson version
        run: |
          mvn -B -q dependency:tree -Dincludes=org.springframework:spring-core,com.fasterxml.jackson.core:jackson-databind \
            -DoutputFile=/tmp/core-tree.txt -DappendOutput=true || true
          grep -Eo "org.springframework:spring-core:jar:[0-9][^ :]*" /tmp/core-tree.txt 2>/dev/null \
            | sort -u | head -3 | sed 's/^/::notice::CORE-DEP /' || true
          grep -Eo "com.fasterxml.jackson.core:jackson-databind:jar:[0-9][^ :]*" /tmp/core-tree.txt 2>/dev/null \
            | sort -u | head -3 | sed 's/^/::notice::JACKSON-DEP /' || true

      # 硬保险：surefire 2.x 遇到 JUnit 5 会静默跑 0 个测试并报成功。
      # 只有「测试数 > 0 且失败数 = 0」才算通过，不接受空跑。
      - name: Assert tests actually ran
        run: |
          total=0; failures=0; errors=0; skipped=0; files=0
          while IFS= read -r f; do
            files=$((files+1))
            line=$(grep -m1 -E '^Tests run:' "$f" || true)
            [ -n "$line" ] || continue
            total=$((total + $(echo "$line" | sed -E 's/.*Tests run: *([0-9]+).*/\1/')))
            failures=$((failures + $(echo "$line" | sed -E 's/.*Failures: *([0-9]+).*/\1/')))
            errors=$((errors + $(echo "$line" | sed -E 's/.*Errors: *([0-9]+).*/\1/')))
            skipped=$((skipped + $(echo "$line" | sed -E 's/.*Skipped: *([0-9]+).*/\1/')))
            echo "  $f -> $line"
          done < <(find . -path '*/target/surefire-reports/*.txt' | sort)
          echo "===== 报告文件数=$files 测试总数=$total 失败=$failures 错误=$errors 跳过=$skipped ====="
          echo "::notice::测试统计 报告文件=$files 测试总数=$total 失败=$failures 错误=$errors 跳过=$skipped"
          if [ "$files" -eq 0 ]; then
            echo "::error::没有找到任何 surefire 报告：测试根本没有执行"
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::测试总数为 0：构建「成功」但一个测试都没跑，这不叫通过"
            exit 1
          fi
          if [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ]; then
            echo "::error::存在失败或错误的测试：failures=$failures errors=$errors"
            exit 1
          fi
          echo "✅ $total 个测试全部执行且通过"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/surefire-reports/*.txt'
          if-no-files-found: error

  # -------------------------------------------------------------------
  # DDL 验证：db/migration 里的脚本必须在真实 PostgreSQL 上跑得通
  #
  # 为什么必须单独一个 job：构建 job 的测试作用域只有 H2，
  # 而 V3/V4 的 PARTITION BY RANGE 与 V5 的 vector(1024)+HNSW 是 PostgreSQL 专有的，
  # H2 根本不支持。也就是说 V2~V6 的 13 张表在加这个 job 之前
  # **从未被任何数据库执行过一次**——语法错、分区顺序错、COMMENT ON 的列名拼错，
  # 全都要等到 M2 第一次启动才炸。schema 属于「改不了要重来」的那一类，
  # 晚发现的代价是非线性的。
  #
  # ⚠️ 第一轮 continue-on-error: true：脚本还没被验证过，很可能有错。
  #    先把错误暴露成 annotation 看清楚，修完之后**必须把这个开关去掉**，
  #    让它变成硬失败。留着 continue-on-error 就等于没有这道防线。
  # -------------------------------------------------------------------
  ddl:
    name: DDL on PostgreSQL 16 + pgvector
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: oncall
          POSTGRES_DB: oncall
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Run V1..V6 against a real database
        env:
          PGPASSWORD: oncall
        run: |
          fail=0
          for f in $(ls db/migration/V*.sql | sort -V); do
            echo "===== $f ====="
            if psql -h localhost -U postgres -d oncall -v ON_ERROR_STOP=1 -f "$f"; then
              echo "::notice::DDL-OK $f"
            else
              echo "::error::DDL-FAIL $f 执行失败"
              fail=1
            fi
          done
          echo "===== 建表结果 ====="
          psql -h localhost -U postgres -d oncall -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name"
          n=$(psql -h localhost -U postgres -d oncall -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "::notice::DDL-表数 $n"
          echo "===== 约束核查（幂等与不能自审） ====="
          psql -h localhost -U postgres -d oncall -c \
            "SELECT conname, contype FROM pg_constraint WHERE conname IN ('uq_agent_step_idem','chk_approval_not_self','chk_onto_criticality') ORDER BY conname"
          exit $fail

      - name: Verify idempotency re-run (脚本必须可重复执行)
        env:
          PGPASSWORD: oncall
        run: |
          for f in $(ls db/migration/V*.sql | sort -V); do
            psql -h localhost -U postgres -d oncall -v ON_ERROR_STOP=1 -f "$f" || {
              echo "::error::DDL-RERUN-FAIL $f 第二次执行失败（脚本不是幂等的）"
              exit 1
            }
          done
          echo "::notice::DDL-幂等 全部脚本可重复执行"
